  title: Firefly Airline API
  version: "1.0"
paths:
  /airports:
    get:
      description: Returns airports, optionally filtered by city.
      parameters:
      - description: Filter by city ID
        in: query
        name: city_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/firefly-airline_internal_api.APIResponse-array_internal_domains_airport_AirportResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - AgencyAPIKey: []
      summary: List airports
      tags:
      - Airports
  /cities:
